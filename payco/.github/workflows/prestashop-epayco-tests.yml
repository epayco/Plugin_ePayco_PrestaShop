name: PrestaShop ePayco Tests

on:
  push:
    branches: [main, develop, tests/*]
  pull_request:
    branches: [main, develop, tests/*]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL del PrestaShop para E2E (incluye /es/ al final)"
        required: true
        default: "https://habits-caroline-vernon-exotic.trycloudflare.com/es/"

jobs:
  # ==================================================================
  # Lint - PHP syntax check
  # ==================================================================
  lint:
    name: "Lint (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, json, dom, curl
          tools: composer:v2

      - name: PHP syntax check
        run: |
          find . \
            -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./tests/e2e/node_modules/*" \
            -print0 \
            | xargs -0 -n1 -P4 php -l

  # ==================================================================
  # E2E Tests - Playwright
  # ==================================================================
  e2e-tests:
    name: "E2E: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Tarjeta de crédito: flujos legacy ---
          - name: "Tarjeta Aceptada"
            grep: "Pago aceptado - transaccion 1"

          - name: "Tarjeta Rechazada"
            grep: "Pago rechazado por fondos insuficientes"

          - name: "Tarjeta Fallida"
            grep: "Pago fallido por error de comunicacion"

          - name: "Tarjeta Pendiente"
            grep: "Pago pendiente por validacion"

          # --- Flujo nuevo: rechazo inline + reintento con misma orden ---
          - name: "Rechazo Inline + Reintento"
            grep: "Rechazo inline"

    env:
      BASE_URL: ${{ github.event.inputs.base_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: "Run E2E: ${{ matrix.name }}"
        working-directory: tests/e2e
        run: npx playwright test creditcard.spec.js -g "${{ matrix.grep }}" --reporter=line --workers=1

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.name }}
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
